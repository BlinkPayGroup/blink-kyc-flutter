name: blink_kyc
description: >-
  Drop-in identity verification for Flutter. Your backend mints a session; the
  SDK runs the document and liveness capture and returns a verdict.
version: 1.3.0
homepage: https://blink-pay.net/kyc/
repository: https://github.com/BlinkPayGroup/blink-kyc-flutter
# Proprietary — do not publish to pub.dev. Remove `publish_to` only to push to a
# private/company registry that is entitled to this package.
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0
  camera: ^0.11.0
  # Real on-device face detection for the liveness fit-oval (replaces the old
  # luma proxy). Same class of face-detection model used on the web.
  google_mlkit_face_detection: ">=0.9.0 <1.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
